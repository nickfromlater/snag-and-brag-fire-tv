schema-version = 1

[package]
title = "Snag & Brag"
version = "0.1.0"
id = "com.snagbrag.tv"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.expo_constants_2@IExpoConstants_0"

[[needs.module]]
id = "/com.amazon.kepler.expo_file_system_2@IExpoFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_2@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_2@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"










[components]
[[components.interactive]]
id = "com.snagbrag.tv.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
# Phone controllers do not produce TV remote input. Keep a complete game and
# rematches in the foreground; this is an app timeout, not a display wake lock.
timeout-secs = 1800
categories = ["com.amazon.category.main", "com.amazon.category.kepler.media"]

[[extras]]
key = "interface.provider"
component-id = "com.snagbrag.tv.main"

[extras.value.application]
[[extras.value.application.interface]]
interface_name = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = ["Next"]
features = ["VariableSpeed"]

[wants]
[[wants.service]]
id = "com.amazon.inputd.service"
[[wants.service]]
id = "com.amazon.gipc.uuid.*"
[[wants.service]]
id = "com.amazon.media.server"
[[wants.service]]
id = "com.amazon.media.playersession.service"
[[wants.service]]
id = "com.amazon.mediametrics.service"
[[wants.service]]
id = "com.amazon.audio.stream"
[[wants.service]]
id = "com.amazon.audio.control"
[[wants.service]]
id = "com.amazon.audio.system"
[[wants.service]]
id = "com.amazon.mediabuffer.service"
[[wants.service]]
id = "com.amazon.mediatransform.service"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"
