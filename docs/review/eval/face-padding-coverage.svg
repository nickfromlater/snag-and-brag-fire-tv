<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Melvin forehead coverage with 25, 40 and 45 percent top padding"><rect width="960" height="330" fill="white"/><g font-family="Arial, sans-serif" fill="#142334"><text x="24" y="29" font-size="21" font-weight="bold">Melvin: measured face-box coverage (25% sides and bottom)</text><text x="24" y="52" font-size="14">Green dashed: annotated face. Blue: area pixelated by the phone. Annotation begins at y=160.</text><g transform="translate(0,0)"><text x="160" y="82" text-anchor="middle" font-size="18" font-weight="bold">25% top margin</text><g transform="translate(65,95)"><rect x="10" y="30" width="149" height="149" fill="#E4F0FF" stroke="#145AA3" stroke-width="2"/><rect x="15" y="10" width="134" height="163" fill="none" stroke="#18783C" stroke-width="3" stroke-dasharray="6 3"/></g><text x="160" y="301" text-anchor="middle" font-size="16">87.7% covered · starts y=180</text></g><g transform="translate(320,0)"><text x="160" y="82" text-anchor="middle" font-size="18" font-weight="bold">40% top margin</text><g transform="translate(65,95)"><rect x="10" y="15" width="149" height="164" fill="#E4F0FF" stroke="#145AA3" stroke-width="2"/><rect x="15" y="10" width="134" height="163" fill="none" stroke="#18783C" stroke-width="3" stroke-dasharray="6 3"/></g><text x="160" y="301" text-anchor="middle" font-size="16">96.9% covered · starts y=165</text></g><g transform="translate(640,0)"><text x="160" y="82" text-anchor="middle" font-size="18" font-weight="bold">45% top margin</text><g transform="translate(65,95)"><rect x="10" y="10" width="149" height="169" fill="#E4F0FF" stroke="#145AA3" stroke-width="2"/><rect x="15" y="10" width="134" height="163" fill="none" stroke="#18783C" stroke-width="3" stroke-dasharray="6 3"/></g><text x="160" y="301" text-anchor="middle" font-size="16">100.0% covered · starts y=160</text></g></g></svg>
